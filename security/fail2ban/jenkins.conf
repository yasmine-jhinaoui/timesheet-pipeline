# Protection du login Jenkins contre le brute force
[jenkins-auth]
enabled  = true
filter   = jenkins-auth
logpath  = /var/log/jenkins/access_log
backend  = auto
port     = 9191
maxretry = 5
findtime = 10m
bantime  = 15m
# Ne jamais bannir la machine locale (evite de se bloquer soi-meme)
ignoreip = 127.0.0.1/8 ::1
