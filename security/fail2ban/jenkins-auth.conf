# Detection des echecs de connexion Jenkins (access log, format combined)
# Un echec de login = redirection vers /loginError avec le code 401
[Definition]
failregex = ^\[?<HOST>\]? \S+ \S+ \[[^\]]*\] "GET /loginError HTTP/[0-9.]+" 401
ignoreregex =
# Format de date impose : evite que l'IPv6 (0:0:0:...) soit lue comme une heure
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
