global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["host.docker.internal:9191"]

  - job_name: timesheet-app
    metrics_path: /timesheet-devops/actuator/prometheus
    static_configs:
      - targets: ["192.168.49.2:30089"]
        labels:
          application: timesheet-devops
          env: kubernetes

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["192.168.49.2:30081"]
        labels:
          source: kubernetes-api

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["192.168.49.2:30081"]
        labels:
          source: kubernetes-api
